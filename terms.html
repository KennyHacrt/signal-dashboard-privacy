<main><h1>服務條款</h1>
<p>Signal Dashboard 供發布商查閱及核對自己管理的 App 資料。請只連接你擁有或獲授權管理的帳戶，並按相關商店及服務的條款使用報表。</p>
<p>程式依據已連接服務提供的報表顯示數字。AdMob 預估收益可能由 Google 更新。實際應付款項及結算日期以供應商的正式結算記錄為準。</p>
<p>如要停止使用，你可以停用 Windows 同步排程並撤銷 Google 授權。已同步資料的處理方式見<a href="privacy.html">私隱政策</a>。</p>
