<main><h1>Signal Dashboard</h1>
<p>Signal Dashboard 是供 App 發布商使用的 Windows 桌面程式。你可以查看自己帳戶內每個 App 的下載、安裝和收益，再與商店報表對帳。</p>
<h2>連接 Google AdMob</h2><p>授權後，程式會讀取你的發布商帳戶和按日期、App 分列的預估廣告收益，按發布商時區整理，並將報表保存到已設定的 Supabase 專案。Windows 排程可每日更新報表。</p>
<p>連接前可先閱讀<a href="privacy.html">私隱政策</a>，了解程式會讀取和保存哪些資料。</p>
